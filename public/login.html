<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · Code Chat</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" type="module"></script>
</head>
<body class="signin">
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Code Chat</div>
    <button type="button" class="outline" id="theme-toggle" hidden>Light mode</button>
  </header>
  <main class="signin-main">
    <form id="login" class="login-form" method="post" action="/api/login" aria-labelledby="login-title">
      <h1 id="login-title">Sign in</h1>
      <p>Use the email and password provided by your administrator.</p>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      </div>
      <p id="login-error" class="notice error" role="alert"></p>
      <button class="button primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
